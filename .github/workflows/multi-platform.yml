name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main

      - uses: actions/upload-artifact@v7
        with:
          name: BetterPause-Port-Windows
          path: ${{ steps.build.outputs.build-output }}
